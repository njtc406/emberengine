# github.com/njtc406/emberengine/engine/pkg/config/define.go

## 系统基础配置

NodeConf:
  NodeId: 1
  # 系统状态(debug/release)
  SystemStatus: debug
  # 系统数据目录(持久化)
  PVCPath: ./example/data
  # 系统缓存目录
  PVPath: ./example/cache
  # 性能监控(0表示不开启监控)
  ProfilerInterval: 10s
  # 线程池大小=cpu核数*设置值 (配置0表示不开启线程池)
  # 这个根据业务自行调整,cpu密集型一般直接为cpu核数,即设为1
  # 如果是io密集型可以根据:CPU核数 * (1 + 平均等待时间/平均计算时间) 来计算
  # 混合型就只能自行压测找最优
  AntsPoolSize: 1
  # 定时器数量(用于监控rpc调用的timer)
  MonitorTimerSize: 10000
  # 定时器桶数量(决定锁的粒度)
  MonitorBucketSize: 20
  EventBusConf:
    # 全局事件前缀
    GlobalPrefix: "ember.global"
    # 服务器事件前缀
    ServerPrefix: "ember.server"
    # 主服务事件前缀
    MasterPrefix: "ember.master"
    # 从服务事件前缀
    SlavePrefix: "ember.slave"
    # 节点事件前缀
    NodePrefix: "ember.node"
    # 分片数量
    ShardCount: 1000
    # 事件nats的地址配置
    NatsConf:
      EndPoints:
      UserName:
      Password:
      Token:
      Secure:
      Cert:
      CertKey:
      CAs:
      MaxReconnects:
      ReconnectWait:
      Timeout:
      PingInterval:
      PingMaxOutstanding:
      ReconnectBufSize:
  # 去重器配置
  DeDuplicatorConf:
    DeDuplicatorType: "ttl"
    DeDuplicatorTTL: 1s
    DeDuplicatorCleanTTL: 3s
    DeDuplicatorSize: 10000

ClusterConf:
  ETCDConf:
    # etcd地址
    EndPoints:
      - 192.168.145.188:2379
    DialTimeout: 3s
    # etcd用户名
    UserName: root
    # etcd密码
    Password: 123456
    # 是否开启日志
    NoLogger: true
  RPCServers:
    # 监听地址
    - Addr: 0.0.0.0:6610
      # 协议
      Protoc: "tcp"
      # rpc类型
      Type: rpcx
    - Addr: 0.0.0.0:6611
      Protoc: tcp
      Type: grpc
    - Addr: nats://192.168.145.188:4222
      Type: nats
  DiscoveryType: etcd
  RemoteConfPath: ""
  DiscoveryConf:
    Path: /ember/rpc

ServiceConf:
  OpenRemote: false
  RemoteConfPath: ""
  StartServices:
    # 服务名称
    - ClassName: TestService
      ServiceName: Test
      # 服务类型
      Type: test
      # 服务器ID
      ServerId: 1
      # 服务版本
      Version: 1
      # rpc方式
      RpcType: "nats"
      # 系统级线程池大小
      GoroutinePoolSize: 1000
      # 定时器配置
      TimerConf:
        # 定时器队列长度
        TimerSize: 1000
        # 定时器桶大小
        TimerBucketSize: 100
      # 邮箱配置
      Mailbox:
        # 邮箱类型(默认default)
        MailboxType: "default"
        # 工作线程数量(默认1)
        WorkerNum: 1
        # 虚拟线程比例(默认24)
        VirtualWorkerRate: 24
        # 是否开启动态线程数调整(默认不开启)
        DynamicWorkerScaling: false
        # 默认工作线程配置
        DefaultWorkerConf:
          # 是否开启条件等待(默认true,开启后会使用条件变量来等待,否则会使用time.Sleep来等待)
          EnableCond: true
          # 初始退避延迟(默认1ms)
          BackoffBaseDelay: 1ms
          # 最大退避延迟(默认8ms)
          BackoffMaxDelay: 8ms
          # 最大空闲次数(超过后使用条件唤醒)
          MaxIdleBeforeBackoff: 500
          # 最大重试次数(默认2次)
          BackoffMaxRetries: 2
        Strategy:
          # 动态线程数调整策略(默认不开启)
          # 当前可选策略："mailbox_load", "cpu", "composite"
          # "mailbox_load"：基于邮箱负载的动态线程数调整
          # "cpu"：基于CPU利用率的动态线程数调整
          # "composite"：基于复合策略的动态线程数调整
          # (有any和all模式,any表示任意一个策略返回true,则调整线程数,all表示所有策略返回true,则调整线程数)
          # 开启自动调整线程时,默认使用的mailbox_load策略
          Strategy: "composite"
          # 最小工作线程数量(默认1)
          MinWorkerNum: 1
          # 最大工作线程数量
          MaxWorkerNum: 100
          # 线程池增长因子(线程池的数量=当前线程池数量*扩容因子)
          GrowthFactor: 1.5
          # 线程池收缩因子(线程池的数量=当前线程池数量*缩容因子)
          ShrinkFactor: 0.5
          # 线程池调整冷却时间(调整线程数后,需要等待这个时间才能再次调整)
          ResizeCoolDown: 1m
          # 复合策略参数(用map是为了之后方便扩展)
          Params:
            # 模式(any表示任意一个策略返回true,则调整线程数,all表示所有策略返回true,则调整线程数)
            Mode: "any"
          # 子策略配置(用于复合策略)
          Subs:
              # 子策略1:基于CPU利用率的动态线程数调整
            - Strategy: "cpu"
              Params:
                # CPU利用率阈值(这个策略目前有点问题)
                MinLoadThreshold: 0.3
                MaxLoadThreshold: 0.7
              # 子策略2:基于邮箱负载的动态线程数调整
            - Strategy: "mailbox_load"
              Params:
                # 邮箱负载阈值
                # 空闲worker比例(超过阈值就会触发降低)
                IdleThreshold: 0.5
                # 待处理最大负载阈值(如果是多线程模式,为所有工作线程中待处理的和,超过阈值就会触发增加)
                MaxLoadThreshold: 50

      ServiceLogConf:
        # 是否开启独立日志(默认使用系统日志器)
        Enable: true
        Config:
          Path: ./example/data/logs
          # 日志文件名
          Name: "Test"
          # 日志级别
          Level: debug
          # 是否打印调用文件信息
          Caller: true
          # 是否打印完整调用文件信息
          FullCaller: false
          # 是否显示日志颜色
          Color: true
          # 日志最大保存时间(默认15天)
          MaxAge: 720h
          # 日志切分周期(默认24h)
          RotationTime: 24h
          AsyncMode:
            # 开启异步模式(默认开启)
            Enable: true
            Config:
              # 刷新间隔(默认1s)
              FlushInterval: 1s
              # 缓冲区大小(默认1M,满时会立即写入)
              BufferSize: 1048576
    - ClassName: Service2
      ServiceName: Service2
      Type: test
      ServerId: 1
      TimerConf:
        # 定时器队列长度
        TimerSize: 1000
        # 定时器桶大小
        TimerBucketSize: 100
      WorkerConf:
        # 用户消息队列大小(默认128)
        UserMailboxSize: 128
        # 系统消息队列大小(默认16)
        SystemMailboxSize: 16
        # 工作线程数量(初始线程数,默认1)
        WorkerNum: 1
        # 最大工作线程数量(默认1)
        MaxWorkerNum: 10
        # 是否开启动态线程数调整(默认不开启)
        DynamicWorkerScaling: false
        # 虚拟线程比例(默认10)(当workerNum大于1时,虚拟线程倍率用来控制虚拟线程的数量 哈希环上的节点数量=workernum*rate)
        VirtualWorkerRate: 10
        # 线程池增长因子(默认1.5)(当负载大于最大负载时,则启动新的线程)
        GrowthFactor: 1.5
        # 线程池收缩因子(默认0.5)(当负载小于最小负载时,则收缩线程)
        ShrinkFactor: 0.5
        # 缩容冷却时间(默认1秒)(当负载小于最小负载时,则关闭多余的线程)
        ResizeCoolDown: 1s
        # 扩容策略名称(默认default,根据worker负载扩容)
        Strategy:
          # 策略名称
          Name: default
          Params:
            # 最大负载(默认10,超过就会启动动态扩容,扩容后超过半数无负载则开启缩容)
            MaxLoadThreshold: 10
          Subs: # 子策略

# 系统日志器配置
SystemLogger:
  Path: ./example/data/logs
  # 日志文件名
  Name: "system"
  # 日志级别
  Level: debug
  # 是否打印调用文件信息
  Caller: true
  # 是否打印完整调用文件信息
  FullCaller: false
  # 是否显示日志颜色
  Color: true
  # 日志最大保存时间(默认15天)
  MaxAge: 720h
  # 日志切分周期(默认24h)
  RotationTime: 24h
  AsyncMode:
    # 开启异步模式(默认不开启,内部调试时可以关闭)
    Enable: true
    Config:
      # 刷新间隔(默认1s)
      FlushInterval: 1s
      # 缓冲区大小(默认1M,满时会立即写入)
      BufferSize: 1048576

