## 系统基础配置

NodeConf:
  NodeId: 1
  # 系统状态(debug/release)
  SystemStatus: debug
  # 系统数据目录(持久化)
  PVCPath: ./example/data
  # 系统缓存目录
  PVPath: ./example/cache
  # 性能监控(0表示不开启监控)
  ProfilerInterval: 10s
  # 线程池大小
  AntsPoolSize: 1
  # 定时器数量(用于监控rpc调用的timer)
  MonitorTimerSize: 10000
  # 定时器桶数量(决定锁的粒度)
  MonitorBucketSize: 20

ClusterConf:
  ETCDConf:
    # etcd地址
    EndPoints:
      - ${REMOTE_HOST}:2379
    DialTimeout: 3s
    # etcd用户名
    UserName: root
    # etcd密码
    Password: 123456
    # 是否开启日志
    NoLogger: true
  RPCServers:
    # 监听地址
    - Addr: 0.0.0.0:6620
      # 协议
      Protoc: "tcp"
      # rpc类型
      Type: "rpcx"
    - Addr: 0.0.0.0:6621
      Protoc: "tcp"
      Type: "grpc"
    - Addr: nats://${REMOTE_HOST}:4222
      Protoc: "tcp"
      Type: "nats"
  DiscoveryType: etcd
  RemoteConfPath: ""
  # 服务发现监听路径
  DiscoveryConf:
    Path: /server/rpc

ServiceConf:
  OpenRemote: false
  RemoteConfPath: ""
  StartServices:
      # 服务ID
    - ClassName: Service3
      ServiceId: 1
      # 服务名称
      ServiceName: Service3
      # 服务类型
      Type: test
      # 服务器ID
      ServerId: 1
      RpcType: "rpcx"
      TimerConf:
        # 定时器队列长度
        TimerSize: 1000
        # 定时器桶大小
        TimerBucketSize: 100
      # 空闲控制配置(控制Worker在无消息时的等待策略)
      IdlerConf:
        # 是否启用条件变量等待
        # - true:  空闲时使用条件变量阻塞(节省CPU，但唤醒有开销)
        # - false: 空闲时使用指数退避睡眠(CPU占用略高，但响应更快)
        EnableCond: false
        # 退避基础延迟(第一次空闲时的睡眠时间)
        BackoffBaseDelay: 1us
        # 退避最大延迟(连续空闲时睡眠时间的上限)
        BackoffMaxDelay: 4us
        # 开始退避前的最大空闲次数(前N次空闲不睡眠，直接重试)
        MaxIdleBeforeBackoff: 1000
        # 退避最大重试次数(睡眠时间翻倍的最大次数)
        BackoffMaxRetries: 2

      # 多优先级队列配置(仅在QueueMode="priority"时生效)
      # 如果使用双队列模式(QueueMode="dual")，此配置可省略
      MultiLevelQueueConf:
        # 调度策略
        # - "absolute": 绝对优先策略(始终优先处理高优先级，可能导致低优先级饥饿)
        # - "weighted": 加权策略(按权重分配处理机会，兼顾各优先级)
        # - "fairness": 公平策略(确保所有优先级都有处理机会，防止饥饿)
        Strategy: "absolute"

        # 单次循环最多处理的消息总数(避免长时间阻塞)
        TotalBatchLimit: 64

        # 各优先级的批量处理配置
        # 格式: priority: {BatchSize: 单次最多处理数, Weight: 权重(仅weighted策略使用)}
        PriorityBatches:
          -3: # PrioritySys - 系统消息
            BatchSize: 32
            Weight: 20
          -2: # PriorityUrgent - 紧急消息
            BatchSize: 16
            Weight: 10
          -1: # PriorityHigh - 高优先级消息
            BatchSize: 12
            Weight: 5
          0: # PriorityNormal - 普通消息
            BatchSize: 8
            Weight: 3
          1: # PriorityLow - 低优先级消息
            BatchSize: 4
            Weight: 2
          2: # PriorityBatch - 批量消息
            BatchSize: 2
            Weight: 1

# 日志配置
SystemLogger:
  Path: ./example/data/logs
  # 日志文件名
  Name: "system-2"
  # 日志级别
  Level: debug
  # 是否打印调用文件信息
  Caller: true
  # 是否打印完整调用文件信息
  FullCaller: false
  # 是否显示日志颜色
  Color: true
  # 日志最大保存时间(默认15天)
  MaxAge: 720h
  # 日志切分周期(默认24h)
  RotationTime: 24h
  AsyncMode:
    # 开启异步模式(内部调试时可以关闭)
    Enable: true
    Config:
      # 刷新间隔
      FlushInterval: 1s
      # 缓冲区大小(满时会立即写入)
      BufferSize: 1048576  # 1MB

