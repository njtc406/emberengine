syntax = "proto3";
package proto;
option go_package = ".;proto";

message Message {
  uint64 SessionId = 1;
  int64 Uid = 2;
  int32 Id = 3;
  bytes Data = 4;
  map<string, string> Meta = 5;
  repeated int64 Uids = 6;
}

message KickReq {
  int64 Uid = 1;
  uint64 SessionId = 2;
  string Reason = 3;
}

message GetClientIpReq {
  int64 Uid = 1;
}

message GetClientIpResp {
  string Ip = 1;
}