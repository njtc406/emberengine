# github.com/njtc406/emberengine/engine/pkg/config/define.go

## 系统基础配置

NodeConf:
  NodeId: 1
  # 系统状态(debug/release)
  SystemStatus: debug
  # 系统数据目录(持久化)
  PVCPath: ./example/data
  # 系统缓存目录
  PVPath: ./example/cache
  # 线程池大小=cpu核数*设置值 (配置0表示不开启线程池)
  # 这个根据业务自行调整,cpu密集型一般直接为cpu核数,即设为1
  # 如果是io密集型可以根据:CPU核数 * (1 + 平均等待时间/平均计算时间) 来计算
  # 混合型就只能自行压测找最优
  AntsPoolSize: 1
  RpcMonitorConf:
    # 定时器数量(用于监控rpc调用的timer)
    MonitorTimerSize: 10000
    # 定时器桶数量(决定锁的粒度)
    MonitorBucketSize: 20
    # RPC 调用默认超时时间(不配置则默认1秒)
    # 这是业务层 RPC 调用的超时时间，应设置得较严格以快速失败
    DefaultRpcTimeout: 1s
    # RPC 超时检查间隔(不配置则默认1秒)
    # Monitor 检查超时的周期，建议不大于 DefaultRpcTimeout
    CheckTimeoutInterval: 1s
  EventBusConf:
    # 全局事件前缀
    GlobalPrefix: "ember.global"
    # 服务器事件前缀
    ServerPrefix: "ember.server"
    # 特定服务事件前缀
    SpecificPrefix: "ember.specific"
    # 主服务事件前缀
    MasterPrefix: "ember.master"
    # 从服务事件前缀
    SlavePrefix: "ember.slave"
    # 节点事件前缀
    NodePrefix: "ember.node"
    # 分片数量
    ShardCount: 1000
    # 事件nats的地址配置
    NatsConf:
      EndPoints:
      UserName:
      Password:
      Token:
      Secure:
      Cert:
      CertKey:
      CAs:
      MaxReconnects:
      ReconnectWait:
      Timeout:
      PingInterval:
      PingMaxOutstanding:
      ReconnectBufSize:
  # 去重器配置
  DeDuplicatorConf:
    DeDuplicatorType: "ttl"
    DeDuplicatorTTL: 1s
    DeDuplicatorCleanTTL: 3s
    DeDuplicatorSize: 10000
  TimingWheelConf:
    # 时间精度
    Interval: 1s
    # 槽位数
    WheelSize: 3600

ClusterConf:
  ETCDConf:
    # etcd地址
    EndPoints:
      - 192.168.145.188:2379
    DialTimeout: 3s
    # etcd用户名
    UserName: root
    # etcd密码
    Password: 123456
    # 是否开启日志
    NoLogger: true
  RPCServers:
    # 监听地址
    - Addr: 0.0.0.0:6610
      # 协议
      Protoc: "tcp"
      # rpc类型
      Type: rpcx
      # 网络层读超时(仅 TCP 类型生效，默认30秒)
      # 用于底层 TCP 连接管理，应设置得比 RPC 超时宽松
      ReadDeadline: 30s
      # 网络层写超时(仅 TCP 类型生效，默认30秒)
      WriteDeadline: 30s
    - Addr: 0.0.0.0:6611
      Protoc: tcp
      Type: grpc
      ReadDeadline: 30s
      WriteDeadline: 30s
    - Addr: nats://192.168.145.188:4222
      Type: nats
  DiscoveryType: etcd
  RemoteConfPath: ""
  DiscoveryConf:
    # 服务发现路径
    Path: /ember/rpc
    # 租约 TTL（秒）
    TTL: 10
    # 主从选举路径
    MasterPath: /ember/master
    # 恢复机制配置（可选，不配置则使用默认值）
    RecoveryConf:
      # 退避基础延迟，默认 1s
      BackoffBaseDelay: 1s
      # 退避最大延迟，默认 30s
      BackoffMaxDelay: 30s
      # 详细日志输出次数（前N次每次都输出），默认 5
      VerboseLogCount: 5
      # 日志输出间隔（之后每N次输出一次），默认 10
      LogInterval: 10

ServiceConf:
  OpenRemote: false
  RemoteConfPath: ""
  StartServices:
    # 服务名称
    - ClassName: TestService
      ServiceName: Test
      # 服务类型
      Type: test
      # 服务器ID
      ServerId: 1
      # 服务版本
      Version: 1
      # rpc方式
      RpcType: "nats"
      # 系统级线程池大小
      GoroutinePoolSize: 1000
      # 定时器配置
      TimerConf:
        # 定时器队列长度
        TimerSize: 1000
        # 定时器桶大小
        TimerBucketSize: 100
      # 邮箱配置
      Mailbox:
        # 队列模式选择
        # - "dual":     双队列模式(系统队列+用户队列，简单高效，适用于大多数场景)
        # - "priority": 多优先级队列模式(支持6个优先级层级和多种调度策略)
        QueueMode: "dual"

        # 调度策略配置
        SchedulePolicy:
          # 初始工作线程数量
          # 如果没有开启自动扩容,配置为1表示单线程模型actor
          # 如果开启了自动扩容,那么只代表初始的线程数量
          # 如果直接设置为>1,表示直接开启并发模型,服务会以多线程方式运行
          InitialWorkerNum: 1
          
          # 虚拟节点倍率(用于一致性哈希)
          # 建议: 10-24之间，值越大消息分布越均匀，但哈希计算开销越大
          VirtualWorkerRate: 16
          
          # 是否开启自动扩缩容
          EnableAutoScaling: false
          
          # 动态线程数调整策略(仅在EnableAutoScaling=true时生效)
          # 当前可选策略："max_load", "cpu", "composite"
          # - "max_load":  基于邮箱负载的动态调整
          # - "cpu":       基于CPU利用率的动态调整
          # - "composite": 复合策略(支持any/all模式)
          ScalingStrategy:
            Name: "composite"
            MinWorkerNum: 1
            MaxWorkerNum: 100
            GrowthFactor: 1.5
            ShrinkFactor: 0.5
            ResizeCoolDown: 1m
            Params:
              Mode: "any"
            Subs:
              - Name: "cpu"
                Params:
                  MinLoadThreshold: 0.3
                  MaxLoadThreshold: 0.7
              - Name: "max_load"
                Params:
                  # 空闲worker比例阈值(超过此值触发缩容)
                  IdleThreshold: 50
                  # 单个worker最大负载阈值(超过此值触发扩容)
                  MaxLoadThreshold: 100
          
          # 空闲控制配置(控制Worker在无消息时的等待策略)
          IdlerConf:
            # 是否启用条件变量等待
            # - true:  空闲时使用条件变量阻塞(节省CPU，但唤醒有开销)
            # - false: 空闲时使用指数退避睡眠(CPU占用略高，但响应更快)
            EnableCond: true
            # 退避基础延迟(第一次空闲时的睡眠时间)
            BackoffBaseDelay: 1us
            # 退避最大延迟(连续空闲时睡眠时间的上限)
            BackoffMaxDelay: 16us
            # 开始退避前的最大空闲次数(前N次空闲不睡眠，直接重试)
            MaxIdleBeforeBackoff: 1000
            # 退避最大重试次数(睡眠时间翻倍的最大次数)
            BackoffMaxRetries: 3
          
          # 多优先级队列配置(仅在QueueMode="priority"时生效)
          # 如果使用双队列模式(QueueMode="dual")，此配置可省略
          MultiLevelQueueConf:
            # 调度策略
            # - "absolute": 绝对优先策略(始终优先处理高优先级，可能导致低优先级饥饿)
            # - "weighted": 加权策略(按权重分配处理机会，兼顾各优先级)
            # - "fairness": 公平策略(确保所有优先级都有处理机会，防止饥饿)
            Strategy: "absolute"
            
            # 单次循环最多处理的消息总数(避免长时间阻塞)
            TotalBatchLimit: 64
            
            # 各优先级的批量处理配置
            # 格式: priority: {BatchSize: 单次最多处理数, Weight: 权重(仅weighted策略使用)}
            PriorityBatches:
              -3: # PrioritySys - 系统消息
                BatchSize: 32
                Weight: 20
              -2: # PriorityUrgent - 紧急消息
                BatchSize: 16
                Weight: 10
              -1: # PriorityHigh - 高优先级消息
                BatchSize: 12
                Weight: 5
              0: # PriorityNormal - 普通消息
                BatchSize: 8
                Weight: 3
              1: # PriorityLow - 低优先级消息
                BatchSize: 4
                Weight: 2
              2: # PriorityBatch - 批量消息
                BatchSize: 2
                Weight: 1
      ServiceLogConf:
        # 是否开启独立日志(默认使用系统日志器)
        Enable: true
        Config:
          Path: ./engine/example/data/logs
          # 日志文件名(默认使用服务名称)
          Name: ""
          # 日志级别
          Level: debug
          # 是否打印到标准输出(默认不打印,可以被Init时的状态覆盖)
          Stdout: false
          # 是否打印调用文件信息
          Caller: true
          # 是否打印完整调用文件信息(默认false,完整路径是绝对路径,否则打印以项目根目录为基准的相对路径)
          FullCaller: false
          # 是否显示日志颜色
          Color: true
          # 日志切割配置
          Rotation:
            # 日志最大保存时间(默认15天)
            MaxAge: 720h
            # 日志切分周期(默认24h)
            Every: 24h
            # 文件切分精度(系统会根据切分周期自动推导)
            Pattern: "%Y%m%d"
          Routing:
            AsyncMode:
              # 开启异步模式(默认不开启,内部调试时可以关闭)
              Enable: true
              Config:
                # 刷新间隔(默认1s)
                FlushInterval: 1s
                # 缓冲区大小(默认1M,满时会立即写入)
                BufferSize: 1048576
            # 路由规则
            Routes:
              # 路由文件名(最终生成的文件名称为 Dir/Name_RoutesName_Pattern)
              - Name: "access"
                Levels:
                  - info
                  - debug
                  - trace
                  - warn
              - Name: "error"
                Levels:
                  - error
                  - fatal
                  - panic

# 系统日志器配置
SystemLogger:
  Dir: ./example/data/logs
  # 日志文件名
  PrefixName: "app"
  # 日志级别
  Level: debug
  # 是否打印到标准输出(默认不打印,可以被Init时的状态覆盖)
  Stdout: false
  # 是否打印调用文件信息
  Caller: true
  # 是否打印完整调用文件信息(默认false,完整路径是绝对路径,否则打印以项目根目录为基准的相对路径)
  FullCaller: false
  # 是否显示日志颜色
  Color: true
  # 日志切割配置
  Rotation:
    # 日志最大保存时间(默认15天)
    MaxAge: 720h
    # 日志切分周期(默认24h)
    Every: 24h
    # 文件切分精度(系统会根据切分周期自动推导)
    Pattern: "_%Y%m%d.log"
  Routing:
    AsyncMode:
      # 开启异步模式(默认不开启,内部调试时可以关闭)
      Enable: true
      Config:
        # 刷新间隔(默认1s)
        FlushInterval: 1s
        # 缓冲区大小
        BufferSize: 1024
    # 路由规则
    Routes:
        # 路由文件名(最终生成的文件名称为 Dir/Name_RoutesName_Pattern)
      - Name: "access"
        Levels:
          - info
          - debug
          - trace
          - warn
      - Name: "error"
        Levels:
          - error
          - fatal
          - panic

