## 系统基础配置

NodeConf:
  NodeId: 1
  NodeType: test
  # 系统状态(debug/release)
  SystemStatus: release
  # 系统数据目录(持久化)
  PVCPath: ./example/data
  # 系统缓存目录
  PVPath: ./example/cache
  # 性能监控(0表示不开启监控)
  ProfilerInterval: 0s
  # 线程池大小 cpu_num*size
  AntsPoolSize: 10000
  # rpc监控配置
  RpcMonitorConf:
    # 定时器数量(用于监控rpc调用的timer)
    MonitorTimerSize: 10000
    # 定时器桶数量(决定锁的粒度)
    MonitorBucketSize: 200
  # 时间轮配置
  TimingWheelConf:
    # 时间精度
    Interval: 500ms
    # 槽位数
    WheelSize: 2000

ClusterConf:
  ETCDConf:
    # etcd地址
    EndPoints:
      - ${REMOTE_HOST}:2379
    DialTimeout: 3s
    # etcd用户名
    UserName: root
    # etcd密码
    Password: 123456  # 仅用于示例，生产环境请使用环境变量
    # 是否开启日志
    NoLogger: true
  RPCServers:
      # 监听地址
    - Addr: 0.0.0.0:6670
      # 协议
      Protoc: "tcp"
      # rpc类型
      Type: "rpcx"
    - Addr: 0.0.0.0:6671
      Protoc: "tcp"
      Type: "grpc"
    - Addr: nats://${REMOTE_HOST}:4222
      Protoc: "tcp"
      Type: "nats"
  DiscoveryType: etcd
  RemoteConfPath: ""
  DiscoveryConf:
    Path: /server/rpc

ServiceConf:
  OpenRemote: false
  RemoteConfPath: ""
  StartServices:
    # 服务名称
    - ClassName: ConcurrencyTest
      ServiceName: ConcurrencyTest
      # 服务类型
      Type: test
      # 服务分区ID(用于服务路由隔离)
      Partition: 10001
      RpcType: "nats"
      Visibility: "cluster"
      # 停机策略配置
      StopPolicy:
        GraceTimeout: 0s
        DrainPolicy: "execute"
      # 定时器配置
      TimerConf:
        # 定时器队列长度
        TimerSize: 1000
        # 定时器桶大小
        TimerBucketSize: 100
      Mailbox:
        # 队列模式选择
        # - "dual":     双队列模式(系统队列+用户队列，简单高效，适用于大多数场景)
        # - "priority": 多优先级队列模式(支持6个优先级层级和多种调度策略)
        QueueMode: "dual"

        # ========== 读写分离配置 ==========
        EnableRWMode: false
        MaxConcurrentReads: 0
        StopTimeout: 10s
        MaxJobExecutionTime: 30s
        ReadPoolSize: 0
        ReadDispatchChanCap: 0

        # ========== 中间件配置 ==========
        MiddlewareConf:
          EnableDispatchKeyStats: true
          DispatchKeyStatsInterval: 10s
          DispatchKeyStatsTopN: 10
          DispatchKeyStatsMaxKeys: 100000
          RateLimitConf:
            Enable: false
            Rate: 10000
            Burst: 1000
            SkipUrgent: true
          CircuitBreakerConf:
            Enable: false
            FailureThreshold: 5
            SuccessThreshold: 3
            CooldownDuration: 30s
            WindowDuration: 60s
            HalfOpenMaxAllowed: 3

        # 调度策略配置
        SchedulePolicy:
          # 初始工作线程数量
          # 如果没有开启自动扩容,配置为1表示单线程模型actor
          # 如果开启了自动扩容,那么只代表初始的线程数量
          # 如果直接设置为>1,表示直接开启并发模型,服务会以多线程方式运行
          InitialWorkerNum: 100

          # 虚拟节点倍率(已废弃，jump consistent hash 已取代，值被忽略)
          VirtualWorkerRate: 20

          # 是否开启自动扩缩容
          EnableAutoScaling: false

          # 空闲控制配置(控制Worker在无消息时的等待策略)
          IdlerConf:
            # 是否启用条件变量等待
            # - true:  空闲时使用条件变量阻塞(节省CPU，但唤醒有开销)
            # - false: 空闲时使用指数退避睡眠(CPU占用略高，但响应更快)
            EnableCond: false
            # 退避基础延迟(第一次空闲时的睡眠时间)
            BackoffBaseDelay: 1us
            # 退避最大延迟(连续空闲时睡眠时间的上限)
            BackoffMaxDelay: 4us
            # 开始退避前的最大空闲次数(前N次空闲不睡眠，直接重试)
            MaxIdleBeforeBackoff: 1000
            # 退避最大重试次数(睡眠时间翻倍的最大次数)
            BackoffMaxRetries: 2

          # 多优先级队列配置(仅在QueueMode="priority"时生效)
          # 如果使用双队列模式(QueueMode="dual")，此配置可省略
          MultiLevelQueueConf:
            # 调度策略
            # - "absolute": 绝对优先策略(始终优先处理高优先级，可能导致低优先级饥饿)
            # - "weighted": 加权策略(按权重分配处理机会，兼顾各优先级)
            # - "fairness": 公平策略(确保所有优先级都有处理机会，防止饥饿)
            Strategy: "absolute"

            # 单次循环最多处理的消息总数(避免长时间阻塞)
            TotalBatchLimit: 64

            # 各优先级的批量处理配置
            # 格式: priority: {BatchSize: 单次最多处理数, Weight: 权重(仅weighted策略使用)}
            PriorityBatches:
              -3: # PrioritySys - 系统消息
                BatchSize: 32
                Weight: 20
              -2: # PriorityUrgent - 紧急消息
                BatchSize: 16
                Weight: 10
              -1: # PriorityHigh - 高优先级消息
                BatchSize: 12
                Weight: 5
              0: # PriorityNormal - 普通消息
                BatchSize: 8
                Weight: 3
              1: # PriorityLow - 低优先级消息
                BatchSize: 4
                Weight: 2
              2: # PriorityBatch - 批量消息
                BatchSize: 2
                Weight: 1

    - ClassName: PprofService
      ServiceName: PprofService
      Type: test
      Partition: 10001
      StopPolicy:
        GraceTimeout: 0s
        DrainPolicy: "execute"
